name: Emulator UI Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/emulator-test.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/65-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          egrep -c '(vmx|svm)' /proc/cpuinfo || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run instrumented test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-snapshot-load -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            PKG=com.nocturne.player.debug

            # Build, install and run the instrumentation tests (emulator is already up).
            ./gradlew connectedCoreDebugAndroidTest --no-daemon

            # Pull screenshots captured by the test.
            adb root || true
            adb wait-for-device
            sleep 2
            mkdir -p artifacts/screenshots
            adb pull /sdcard/Android/data/$PKG/files/test_screenshots artifacts/screenshots || true

            # Dump full logcat for diagnosis.
            adb logcat -d > artifacts/logcat.txt || true

      - name: Upload screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-artifacts
          path: artifacts
          if-no-files-found: warn

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
