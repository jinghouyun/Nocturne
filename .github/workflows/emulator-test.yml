name: Emulator UI Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/emulator-test.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/65-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          egrep -c '(vmx|svm)' /proc/cpuinfo || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew scripts/ci-emulator-test.sh

      - name: Install emulator native dependencies
        # The emulator's qemu binary is dynamically linked against libpulse and
        # fails to start with "libpulse.so.0: cannot open shared object" on
        # runner images that dropped it, even when -no-audio is passed (the
        # missing library aborts startup before that flag is parsed).
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Run instrumented test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD (Automation Test Distribution) images are stripped down and boot
          # much faster than the full google_apis images under software rendering.
          api-level: 30
          target: google_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          ram-size: 2048
          cores: 2
          emulator-options: -no-window -no-snapshot-save -no-snapshot-load -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          # Single command: the action runs each script line in a separate
          # sh -c (dropping vars/flags), so all logic lives in the script file,
          # which always collects artifacts and returns the real exit code.
          script: bash scripts/ci-emulator-test.sh

      - name: Upload screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-artifacts
          path: artifacts
          if-no-files-found: warn

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
